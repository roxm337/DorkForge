[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dorkforge"
version = "1.0.0"
description = "Google Dorking & CVE Hunting Platform"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "0x1337"},
]
requires-python = ">=3.10"
dependencies = [
    "cloakbrowser>=0.5.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "PyQt6>=6.5.0",
]

[project.scripts]
dorkforge = "dorkforge.cli:cli"
dorkforge-gui = "dorkforge.ui.main_window:main"

[project.urls]
Homepage = "https://github.com/0x1337/dorkforge"

[tool.setuptools.packages.find]
include = ["dorkforge*"]

[tool.setuptools.package-data]
"dorkforge.ui" = ["resources/*"]
